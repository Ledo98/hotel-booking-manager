<button class="chatbot-toggle" (click)="toggleChat()">
  <i class="bi" [class.bi-chat-dots-fill]="!isChatOpen()" [class.bi-x-lg]="isChatOpen()"></i>
</button>

@if (isChatOpen()) {
  <div class="chatbot-window card shadow-lg">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-2">
      <h6 class="mb-0"><i class="bi bi-robot"></i> Hotel AI Assistant</h6>
      <button class="btn-close btn-close-white" (click)="toggleChat()"></button>
    </div>
    
    <div class="chat-messages p-3">
      @for (msg of messages(); track $index) {
        <div class="message" [class.user-msg]="msg.sender === 'user'" [class.bot-msg]="msg.sender === 'bot'">
          {{ msg.text }}
        </div>
      }
      
      @if (isLoading()) {
        <div class="message bot-msg">
          <span class="spinner-border spinner-border-sm"></span> Typing...
        </div>
      }
    </div>

    <div class="chat-input p-2 border-top">
      <div class="input-group">
        <input 
          type="text" 
          class="form-control" 
          placeholder="Type a message..." 
          [ngModel]="userMessage()" 
          (ngModelChange)="userMessage.set($event)"
          (keyup.enter)="sendMessage()"
          [disabled]="isLoading()"
        >
        <button class="btn btn-primary" (click)="sendMessage()" [disabled]="isLoading()">
          <i class="bi bi-send-fill"></i>
        </button>
      </div>
    </div>
  </div>
}
