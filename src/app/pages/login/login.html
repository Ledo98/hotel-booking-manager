<div class="login-container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-4" style="width: 400px;">
    <div class="text-center mb-4">
      <i class="bi bi-building-fill-check display-4 text-primary"></i>
      <h3 class="mt-2">Hotel Manager</h3>
      <p class="text-muted">Sign in to view your bookings</p>
    </div>
    
    <div class="mb-3">
      <label class="form-label">Guest Name</label>
      <input 
        type="text" 
        class="form-control form-control-lg" 
        placeholder="e.g. Mohamed Walid"
        [ngModel]="username()" 
        (ngModelChange)="username.set($event)"
        (keyup.enter)="login()"
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control form-control-lg" placeholder="Anything..." value="12345">
    </div>

    @if (errorMsg()) {
      <div class="alert alert-danger py-2 small">{{ errorMsg() }}</div>
    }

    <button class="btn btn-primary w-100 btn-lg mt-2" (click)="login()">
      Sign In <i class="bi bi-box-arrow-in-right ms-1"></i>
    </button>
  </div>
</div>
